name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let an in-flight one finish rather than
# cancelling it mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: xvfb-run -a npm run test:browser -- --project=${{ matrix.browser }}
        env:
          FOD_REAL_POINTER_LOCK: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  build:
    needs: browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build
        env:
          # vite.config.ts reads this for `base`; Pages serves from /<repo>/
          FOD_BASE: /Fall-of-Duty/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
